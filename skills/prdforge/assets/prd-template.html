<!doctype html>
<!-- prdforge-template-note
  prdforge v3 PRD shell, project-f visual system (Stripe-derived tokens, sidebar nav, both themes).
  render_prd.py replaces the TITLE token, the PRDFORGE:NAV marker and the PRDFORGE:BODY marker,
  then strips this note. THEME FAMILY: the data-family value on <html> picks the look
  (project-f, almanac, console, grid); change that one value to change the default everywhere,
  bundle.py reads it from here too. Keep the inline CSS and script: they carry the theme tokens, flip button,
  scrollspy, readiness meter, copy button and open-question checklist. Offline only: no URLs.
-->

/* families:end */
*{box-sizing:border-box}
html{scroll-behavior:smooth}
@media (prefers-reduced-motion: reduce){ html{scroll-behavior:auto} *{transition:none!important} }
body{
  margin:0; background:var(--bg); color:var(--text);
  font-family:system-ui,-apple-system,'Segoe UI',Roboto,'Helvetica Neue',Arial,sans-serif;
  font-size:16px; line-height:1.68;
  -webkit-font-smoothing:antialiased; text-rendering:optimizeLegibility;
}
code, .mono{font-family:ui-monospace,'SF Mono','Cascadia Code','Source Code Pro',Menlo,Consolas,monospace}
::selection{background:color-mix(in srgb, var(--brand) 22%, transparent)}
a{color:var(--link); text-decoration-thickness:1px; text-underline-offset:2.5px}
a[id]{scroll-margin-top:28px}
.layout{display:flex; max-width:1800px; margin:0 auto}

/* ── sidebar ── */
nav.side{
  position:sticky; top:0; align-self:flex-start; height:100vh; overflow-y:auto;
  width:272px; flex-shrink:0; padding:28px 18px 28px 24px;
  border-right:1px solid var(--line); font-size:.82rem; scrollbar-width:thin;
}
.nav-brand{padding:0 10px 14px; border-bottom:1px solid var(--line); margin-bottom:10px}
.nav-brand .nb-t{font-weight:650; font-size:.95rem; color:var(--head); letter-spacing:-.01em}
.nav-brand .nb-d{font-family:ui-monospace,'SF Mono',Menlo,Consolas,monospace;
  font-size:.66rem; color:var(--muted); letter-spacing:.06em; text-transform:uppercase; margin-top:3px}
.nav-group{
  font-family:ui-monospace,'SF Mono',Menlo,Consolas,monospace;
  font-size:.64rem; font-weight:600; letter-spacing:.1em; text-transform:uppercase;
  color:var(--muted); margin:16px 0 4px; padding:0 10px;
}
nav.side ul{list-style:none; margin:0; padding:0}
nav.side li{margin:0}
nav.side a{
  display:block; color:var(--muted); text-decoration:none; padding:4px 10px;
  border-radius:7px; line-height:1.4;
  transition:background 120ms cubic-bezier(.23,1,.32,1), color 120ms cubic-bezier(.23,1,.32,1);
}
nav.side a:hover{background:var(--panel); color:var(--head)}
nav.side a.on{background:color-mix(in srgb, var(--brand) 10%, transparent); color:var(--brand-ink); font-weight:600}
.nav-note{color:var(--muted); font-size:.68rem; line-height:1.5; margin-top:18px; padding:12px 10px 0; border-top:1px solid var(--line)}

/* ── main column ── */
main{flex:1; min-width:0; max-width:1180px; padding:44px clamp(20px, 2vw, 48px) 110px}
li{margin:.32rem 0}
strong{font-weight:625; color:var(--head)}
hr{border:none; border-top:1px solid var(--line); margin:3rem 0}
h1{
  font-size:clamp(2rem,3.2vw,2.7rem); font-weight:650; letter-spacing:-.028em;
  line-height:1.08; color:var(--head); text-wrap:balance; margin:1.6rem 0 1rem;
}
h1+p{font-size:1.11rem; color:var(--muted); line-height:1.6}
h2{margin:4.2rem 0 1.1rem; padding-top:2.4rem; border-top:1px solid var(--line)}
.ch-kicker{
  display:flex; gap:.9em; align-items:baseline;
  font-family:ui-monospace,'SF Mono',Menlo,Consolas,monospace;
  font-size:.7rem; font-weight:600; letter-spacing:.09em; text-transform:uppercase;
}
.ch-kicker .ch-act{color:var(--muted)}
.ch-kicker .ch-no{color:var(--brand-ink)}
.ch-title{
  display:block; font-size:1.62rem; font-weight:650; letter-spacing:-.02em;
  line-height:1.22; color:var(--head); text-wrap:balance; margin-top:.35rem;
}
h3{font-size:1.17rem; font-weight:650; letter-spacing:-.012em; color:var(--head);
  line-height:1.3; margin:2.3rem 0 .6rem; text-wrap:balance}
h4{font-size:1rem; font-weight:650; color:var(--head); margin:1.8rem 0 .5rem}
code{font-size:.86em; background:var(--panel); border:1px solid var(--line);
  padding:.08em .34em; border-radius:5px; color:var(--head)}
blockquote{
  margin:1.6rem 0; padding:1.05rem 1.4rem;
  background:var(--panel); border:1px solid var(--line); border-radius:10px;
}
blockquote p{margin:.5rem 0}

/* hero:start (plan-style/assemble.py copies this block, so the PRD and plan open the same way) */
/* ── hero: title, one-line summary, stat cards ── */
.hero{padding:.4rem 0 .2rem}
.hero-kicker{margin:0 0 .9rem; display:flex; flex-wrap:wrap; gap:.35rem .9rem;
  font-family:ui-monospace,'SF Mono',Menlo,Consolas,monospace; font-size:.7rem; font-weight:600;
  letter-spacing:.08em; text-transform:uppercase; color:var(--muted)}
.hero-kicker .k-doc{color:var(--brand-ink)}
.hero h1{font-size:clamp(2.125rem, 3.4vw, 2.75rem); line-height:1.06; letter-spacing:-.03em;
  margin:0 0 .85rem; max-width:30ch; text-wrap:balance}
.hero-sum{margin:0; max-width:44em; font-size:1.11rem; line-height:1.6; color:var(--muted); text-wrap:pretty}
.stats{display:flex; flex-wrap:wrap; gap:12px; margin:1.9rem 0 0; padding:0; list-style:none}
.stats li{margin:0; flex:1 1 150px; min-width:150px; max-width:220px; display:flex}
.stat{flex:1; display:flex; flex-direction:column; gap:.4rem; padding:1rem 1.1rem .95rem;
  border:1px solid var(--line2); border-radius:12px; background:var(--card); box-shadow:var(--shadow);
  color:inherit; text-decoration:none;
  transition:border-color 140ms cubic-bezier(.23,1,.32,1), transform 140ms cubic-bezier(.23,1,.32,1)}
a.stat:hover{border-color:var(--brand); transform:translateY(-2px)}
a.stat:focus-visible{border-color:var(--brand)}
.stat b{font-size:34px; font-weight:700; line-height:1; letter-spacing:-.03em; color:var(--head);
  font-variant-numeric:tabular-nums; white-space:nowrap}
.stat b small{font-size:.44em; font-weight:600; letter-spacing:0; color:var(--muted); margin-left:.12em}
.stat > span{font-size:.78rem; line-height:1.4; color:var(--muted)}
.stat .meter{margin:.15rem 0 0; height:5px}
.stat.warn b{color:var(--warn)} .stat.bad b{color:var(--fail)}
@media (prefers-reduced-motion: reduce){ a.stat:hover{transform:none} }
/* per family */
:root[data-family="almanac"] .hero{display:flex; flex-direction:column}
:root[data-family="almanac"] .hero h1{font-size:clamp(2.4rem, 4.6vw, 3.6rem); line-height:1.04; max-width:20ch; margin:0 0 1.1rem}
:root[data-family="almanac"] .hero-sum{font-family:var(--font-display); font-size:1.32rem; line-height:1.5; color:var(--text); max-width:36em}
:root[data-family="almanac"] .hero-kicker{order:3; margin:1.3rem 0 0; font:inherit; font-size:.86rem; text-transform:none; letter-spacing:0; gap:.2rem 1.1rem}
:root[data-family="almanac"] .hero-kicker .k-doc{font-weight:600}
:root[data-family="almanac"] .stats{order:4; margin-top:2.3rem; gap:0; border-top:1px solid var(--line2); border-bottom:1px solid var(--line2)}
:root[data-family="almanac"] .stats li{max-width:none; flex:1 1 150px; border-right:1px solid var(--line)}
:root[data-family="almanac"] .stats li:last-child{border-right:0}
:root[data-family="almanac"] .stat{background:none; border:0; border-radius:0; box-shadow:none; padding:1.1rem 1.2rem 1.25rem}
:root[data-family="almanac"] a.stat:hover{transform:none; background:var(--panel)}
:root[data-family="almanac"] .stat b{font-family:var(--font-display); font-weight:500; font-size:44px; letter-spacing:-.02em}
:root[data-family="almanac"] .stat > span{font-size:.84rem}
:root[data-family="console"] .hero h1{font-size:clamp(1.75rem, 2.6vw, 2.25rem); font-weight:600; letter-spacing:-.022em; max-width:none; margin:0 0 .45rem}
:root[data-family="console"] .hero-sum{font-size:1rem; max-width:60em}
:root[data-family="console"] .hero-kicker{font-size:.66rem; margin-bottom:.55rem}
:root[data-family="console"] .stats{display:grid; grid-template-columns:repeat(auto-fit, minmax(128px, 1fr)); gap:0;
  border-top:1px solid var(--line2); margin-top:1.2rem}
:root[data-family="console"] .stats li{max-width:none; min-width:0}
:root[data-family="console"] .stat{border:0; border-radius:0; background:transparent; padding:.7rem .9rem .75rem; gap:.25rem;
  box-shadow:inset -1px 0 0 var(--line), inset 0 -1px 0 var(--line2)}
:root[data-family="console"] a.stat:hover{transform:none; background:var(--panel)}
:root[data-family="console"] .stat b{font-family:ui-monospace,'SF Mono',Menlo,Consolas,monospace; font-size:24px; font-weight:600; letter-spacing:-.03em}
:root[data-family="console"] .stat > span{font-size:.72rem}
:root[data-family="grid"]{--hero-pad:2rem}
:root[data-family="grid"] .stat, :root[data-family="grid"] .tbl, :root[data-family="grid"] .req, :root[data-family="grid"] .gate,
:root[data-family="grid"] figure.fig, :root[data-family="grid"] figure.fig .fig-canvas, :root[data-family="grid"] .tldr,
:root[data-family="grid"] .fb, :root[data-family="grid"] #req-q, :root[data-family="grid"] .oq, :root[data-family="grid"] code,
:root[data-family="grid"] blockquote, :root[data-family="grid"] pre.prompt, :root[data-family="grid"] .copy, :root[data-family="grid"] .gate-no,
:root[data-family="grid"] .toc-mobile, :root[data-family="grid"] .meter, :root[data-family="grid"] .meter i, :root[data-family="grid"] .mix,
:root[data-family="grid"] nav.side a, :root[data-family="grid"] .contest, :root[data-family="grid"] .ws, :root[data-family="grid"] .pri,
:root[data-family="grid"] .hm, :root[data-family="grid"] #themeflip{border-radius:0}
:root[data-family="grid"] .hero{background:var(--panel); padding:var(--hero-pad) var(--hero-pad) 0; margin-top:.6rem}
:root[data-family="grid"] .hero h1{font-family:var(--font-display); font-weight:300; font-size:clamp(2.2rem, 4.4vw, 3.5rem);
  letter-spacing:-.02em; line-height:1.08; max-width:18ch}
:root[data-family="grid"] .hero-sum{font-weight:300; font-size:1.25rem; color:var(--text)}
:root[data-family="grid"] .hero-kicker{font-family:inherit; text-transform:none; letter-spacing:.01em; font-size:.8rem; font-weight:400; color:var(--text)}
:root[data-family="grid"] .hero-kicker .k-doc{background:var(--brand); color:var(--bg); padding:0 .45rem; font-weight:600}
:root[data-family="grid"] .stats{display:grid; grid-template-columns:repeat(auto-fit, minmax(150px, 1fr)); gap:2px;
  margin:2rem calc(-1 * var(--hero-pad)) 0; background:var(--panel)}
:root[data-family="grid"] .stats li{max-width:none; min-width:0}
:root[data-family="grid"] .stat{background:var(--bg); border:0; box-shadow:none; padding:1rem 1rem 1.15rem; min-height:128px; justify-content:space-between}
:root[data-family="grid"] a.stat:hover{transform:none; box-shadow:inset 0 0 0 2px var(--brand)}
:root[data-family="grid"] .stat b{order:2; font-family:var(--font-display); font-weight:300; font-size:clamp(30px, 3vw, 44px); letter-spacing:-.02em; white-space:normal; overflow-wrap:break-word}
:root[data-family="grid"] .stat > span{order:1; font-size:.8rem; color:var(--text)}
:root[data-family="grid"] .stat .meter{order:3}
@media (max-width:960px){
  :root[data-family="almanac"] .stats li{flex:1 1 45%; border-bottom:1px solid var(--line)}
  :root[data-family="almanac"] .stats li:nth-child(2n){border-right:0}
  :root[data-family="almanac"] .stats{border-bottom:0}
  :root[data-family="almanac"] .hero h1{font-size:2.3rem}
  :root[data-family="grid"]{--hero-pad:1.1rem}
  :root[data-family="grid"] .hero h1{font-size:2.2rem}
}
/* hero:end */

/* ── the five-minute version ── */
.tldr{margin:2.8rem 0 0; padding:1.9rem 2.1rem 1.5rem; border:1px solid var(--line2);
  border-radius:14px; background:var(--card); box-shadow:var(--shadow);
  position:relative; overflow:hidden}
.tldr::before{content:""; position:absolute; top:0; left:0; right:0; height:3px;
  background:linear-gradient(90deg, var(--sp), var(--sc) 40%, var(--sa) 72%, var(--sd))}
.tldr h2{margin:0 0 1.25rem; padding-top:0; border-top:none}
.tldr .ch-title{font-size:1.42rem}
.tldr-body{column-width:30rem; column-gap:3.2rem; orphans:3; widows:3}
.tldr-body p{font-size:.95rem; line-height:1.62; margin:.6rem 0}
.tldr-body p:first-child{margin-top:0}

/* ── stream pills ── */
.ws{
  font-family:ui-monospace,'SF Mono',Menlo,Consolas,monospace;
  font-size:.72rem; font-weight:600; letter-spacing:.02em;
  padding:.08rem .44rem; border-radius:6px; white-space:nowrap; vertical-align:baseline;
}
.ws.p{color:var(--sp); background:color-mix(in srgb, var(--sp) 10%, transparent); border:1px solid color-mix(in srgb, var(--sp) 28%, transparent)}
.ws.a{color:var(--sa); background:color-mix(in srgb, var(--sa) 10%, transparent); border:1px solid color-mix(in srgb, var(--sa) 28%, transparent)}
.ws.d{color:var(--sd); background:color-mix(in srgb, var(--sd) 10%, transparent); border:1px solid color-mix(in srgb, var(--sd) 28%, transparent)}
.ws.c{color:var(--sc); background:color-mix(in srgb, var(--sc) 10%, transparent); border:1px solid color-mix(in srgb, var(--sc) 28%, transparent)}
.ws.all{color:var(--sn); background:color-mix(in srgb, var(--sn) 10%, transparent); border:1px solid color-mix(in srgb, var(--sn) 28%, transparent)}

/* ── tables ── */
.tbl{overflow-x:auto; margin:1.5rem 0; border:1px solid var(--line);
  border-radius:10px; background:var(--card); box-shadow:var(--shadow)}
table{border-collapse:collapse; width:100%; font-size:.9rem; font-variant-numeric:tabular-nums}
th{
  font-family:ui-monospace,'SF Mono',Menlo,Consolas,monospace;
  text-align:left; font-size:.68rem; font-weight:600; letter-spacing:.07em;
  text-transform:uppercase; color:var(--muted);
  border-bottom:2px solid var(--line2); padding:.62rem .8rem;
  background:var(--panel); white-space:nowrap;
}
th strong{color:var(--muted); font-weight:600}
td{padding:.58rem .8rem; border-bottom:1px solid var(--line); vertical-align:top}
tr:last-child td{border-bottom:none}
td:first-child{font-weight:600; color:var(--head)}

/* week-at-a-glance */
.weekly{min-width:940px; font-size:.86rem; line-height:1.5}
.weekly th:first-child, .weekly td:first-child{
  position:sticky; left:0; z-index:2; background:var(--card);
  border-right:1px solid var(--line2); text-align:center; min-width:5.2ch;
  font-family:ui-monospace,'SF Mono',Menlo,Consolas,monospace; font-size:.8rem; white-space:nowrap;
}
.weekly th:first-child{background:var(--panel)}
.weekly td:not(:first-child){min-width:24ch}
.weekly td:not(:first-child):has(strong){
  background:color-mix(in srgb, var(--brand) 7%, transparent);
}
.weekly td strong{color:var(--brand-ink)}

/* ── gate cards ── */
.gates{display:grid; gap:1.3rem; margin:1.8rem 0}
.gate{border:1px solid var(--line2); border-radius:12px; background:var(--card);
  overflow:hidden; box-shadow:var(--shadow)}
.gate-head{display:flex; gap:1rem; align-items:center; padding:.95rem 1.25rem;
  background:var(--panel); border-bottom:1px solid var(--line)}
.gate-no{
  flex:0 0 auto; width:2.5rem; height:2.5rem; display:grid; place-items:center;
  font-family:ui-monospace,'SF Mono',Menlo,Consolas,monospace;
  font-size:1.25rem; font-weight:700; color:var(--brand-ink);
  background:color-mix(in srgb, var(--brand) 11%, transparent);
  border:1px solid color-mix(in srgb, var(--brand) 30%, transparent); border-radius:9px;
}
.gate-name{font-weight:650; font-size:1.04rem; letter-spacing:-.01em; color:var(--head); line-height:1.3}
.gate-sub{font-size:.8rem; color:var(--muted); margin-top:.15rem; line-height:1.45}
.gate-grid{display:grid; grid-template-columns:1fr 1fr}
.gate-cell{padding:.95rem 1.25rem; font-size:.9rem; line-height:1.6}
.gate-cell p{margin:0; max-width:none}
.gate-cell.fail{border-left:1px solid var(--line)}
.gate-cell.act{grid-column:1 / -1; border-top:1px solid var(--line)}
.gl{
  font-family:ui-monospace,'SF Mono',Menlo,Consolas,monospace;
  font-size:.66rem; font-weight:600; letter-spacing:.09em; text-transform:uppercase;
  color:var(--muted); margin-bottom:.4rem; display:flex; align-items:center; gap:.45em;
}
.gl::before{content:""; width:.5em; height:.5em; border-radius:2px; background:var(--muted)}
.gate-cell.pass .gl::before{background:var(--pass)}
.gate-cell.fail .gl::before{background:var(--fail)}
.gate-cell.act .gl::before{background:var(--warn)}
.gate-kill{display:flex; gap:.9em; align-items:baseline; padding:.75rem 1.25rem;
  background:var(--panel); border-top:1px solid var(--line); font-size:.86rem}
.gate-kill .gl{margin:0; flex:0 0 auto}
.gate-kill .gl::before{background:var(--head)}

/* ── diagrams ── */
/* Figures are inline SVG painted from the tokens, so they follow the page theme
   and the flip button with no JavaScript. Each sits on a tinted panel with its
   caption underneath; on a narrow screen the canvas scrolls sideways inside the
   panel instead of shrinking the diagram past legibility. The .mermaid selectors
   stay only so an unbaked build still gets a card instead of naked code. */
figure.fig{display:block; margin:2rem 0; padding:1.1rem 1.1rem .95rem;
  background:var(--fig); border:1px solid var(--line); border-radius:14px}
figure.fig .fig-canvas{overflow-x:auto; overscroll-behavior-x:contain; border-radius:8px;
  scrollbar-width:thin}
figure.fig svg{display:block; width:100%; height:auto; margin:0 auto}
figure.fig figcaption{margin:.85rem .15rem 0; max-width:70ch; font-size:.84rem;
  line-height:1.55; color:var(--muted); text-wrap:pretty}
figure.fig figcaption b{color:var(--head); font-weight:650}
pre.mermaid, div.mermaid-diagram{
  display:flex; justify-content:center; overflow-x:auto; margin:1.9rem 0;
  padding:1.4rem; background:var(--card); border:1px solid var(--line2);
  border-radius:12px; box-shadow:var(--shadow);
}

/* ── gantt ── */
.gwrap{overflow-x:auto; margin:1.6rem 0 .4rem; border:1px solid var(--line2);
  border-radius:12px; background:var(--card); box-shadow:var(--shadow)}
.gantt{min-width:940px; font-size:.78rem; line-height:1.35}
.g-row{display:flex; border-top:1px solid var(--line)}
.g-row:first-child{border-top:none}
.g-label{flex:0 0 224px; width:224px; padding:5px 12px; border-right:1px solid var(--line2);
  display:flex; flex-direction:column; justify-content:center; color:var(--text);
  position:sticky; left:0; z-index:3; background:var(--card)}
.g-label b{font-weight:650; color:var(--head)}
.g-label small{color:var(--muted); font-size:.85em}
.g-track{position:relative; flex:1; min-height:34px;
  background-image:linear-gradient(to right, var(--line) 1px, transparent 1px);
  background-size:6.1538% 100%}
.g-track::after{content:""; position:absolute; top:0; bottom:0; left:80%; right:0;
  background:color-mix(in srgb, var(--panel) 72%, transparent);
  border-left:2px solid var(--line2); pointer-events:none}
.g-bar{position:absolute; z-index:1; top:6px; bottom:6px; border-radius:6px; color:#fff;
  font-weight:600; font-size:.68rem; display:flex; align-items:center; padding:0 8px;
  white-space:nowrap; overflow:hidden; text-overflow:ellipsis}
.g-bar.p{background:var(--bp)} .g-bar.a{background:var(--ba)}
.g-bar.d{background:var(--bd)} .g-bar.c{background:var(--bc)}
.g-bar.risk{background:transparent; border:2px dashed var(--bp); color:var(--sp); font-weight:650}
.g-phases .g-track{min-height:0; background:var(--panel)}
.g-band{position:absolute; top:0; bottom:0; display:flex; align-items:center; justify-content:center;
  font-family:ui-monospace,'SF Mono',Menlo,Consolas,monospace; font-size:.62rem; font-weight:600;
  letter-spacing:.07em; text-transform:uppercase; color:var(--muted);
  border-left:1px solid var(--line2); padding:4px 6px; overflow:hidden; white-space:nowrap}
.g-band:first-child{border-left:none}
.g-phases .g-label{background:var(--panel)}
.g-head .g-track{display:flex; background-image:none; background:var(--panel); min-height:0}
.g-head .g-label{background:var(--panel); font-family:ui-monospace,'SF Mono',Menlo,Consolas,monospace;
  font-size:.66rem; font-weight:600; letter-spacing:.08em; text-transform:uppercase; color:var(--muted)}
.g-head .g-track span{width:6.1538%; text-align:center; padding:5px 0;
  font-family:ui-monospace,'SF Mono',Menlo,Consolas,monospace; font-size:.7rem; font-weight:600; color:var(--muted)}
.g-head .g-track span.mo{width:20%; border-left:2px solid var(--line2)}
.g-gaterow .g-track{min-height:46px}
.g-gaterow .g-label{font-weight:650; color:var(--head)}
.g-gate{position:absolute; top:8px; width:0}
.g-gate i{position:absolute; left:-5px; top:0; width:10px; height:10px; background:var(--brand);
  border:1.5px solid var(--brand-ink); transform:rotate(45deg); border-radius:2px}
.g-gate em{position:absolute; top:16px; left:-45px; width:90px; text-align:center; font-style:normal;
  font-family:ui-monospace,'SF Mono',Menlo,Consolas,monospace; font-size:.62rem; font-weight:600; color:var(--brand-ink)}
.g-gate.edge-l em{left:-4px; text-align:left}
.g-sec{padding:4px 12px; font-family:ui-monospace,'SF Mono',Menlo,Consolas,monospace;
  font-size:.64rem; font-weight:600; letter-spacing:.09em; text-transform:uppercase;
  border-top:1px solid var(--line); background:var(--panel)}
.g-sec .st{position:sticky; left:12px; display:inline-block}
.g-sec.p{color:var(--sp)} .g-sec.a{color:var(--sa)} .g-sec.d{color:var(--sd)} .g-sec.c{color:var(--sc)}
.g-legend{display:flex; flex-wrap:wrap; gap:1rem; align-items:center; font-size:.75rem;
  color:var(--muted); margin:0 0 1.4rem}
.g-legend span{display:flex; align-items:center; gap:.4em}
.g-legend .chip{display:inline-block; width:20px; height:10px; border-radius:4px}
.g-legend .chip.p{background:var(--bp)} .g-legend .chip.a{background:var(--ba)}
.g-legend .chip.d{background:var(--bd)} .g-legend .chip.c{background:var(--bc)}
.g-legend .chip.risk{background:transparent; border:2px dashed var(--bp)}
.g-legend .dia{display:inline-block; width:9px; height:9px; background:var(--brand);
  border:1.5px solid var(--brand-ink); transform:rotate(45deg); border-radius:2px}

/* ── artwork ── */
figure.art{margin:2.4rem 0 0; border:1px solid var(--line2); border-radius:14px;
  overflow:hidden; background:#F7F7F9; box-shadow:var(--shadow)}
figure.art img{display:block; width:100%; height:auto}

/* ── theme flip ── */
#themeflip{position:fixed; top:14px; right:18px; z-index:50; width:36px; height:36px;
  display:grid; place-items:center; border-radius:50%; border:1px solid var(--line2);
  background:var(--card); color:var(--head); font-size:15px; line-height:1;
  cursor:pointer; box-shadow:var(--shadow)}
#themeflip:hover{background:var(--panel)}

/* ── mobile contents ── */
.toc-mobile{display:none}
:focus-visible{outline:none; box-shadow:0 0 0 3px color-mix(in srgb, var(--link) 30%, transparent); border-radius:4px}
@media (max-width:960px){
  nav.side{display:none}
  main{padding:22px 20px 70px}
  .toc-mobile{display:block; margin:0 0 1.2rem; border:1px solid var(--line);
    border-radius:10px; background:var(--card); padding:.4rem .9rem; font-size:.85rem}
  .toc-mobile summary{cursor:pointer; font-weight:650; color:var(--head); padding:.3rem 0}
  .toc-mobile ul{list-style:none; padding:0}
  .toc-mobile a{display:block; padding:3px 0; color:var(--muted); text-decoration:none}
  .gate-grid{grid-template-columns:1fr}
  .gate-cell.fail{border-left:none; border-top:1px solid var(--line)}
  h1{font-size:1.75rem}
  .ch-title{font-size:1.35rem}
  .tldr{padding:1.35rem 1.1rem 1.1rem}
  .tldr .ch-title{font-size:1.25rem}
}

/* ── prdforge additions (same tokens) ── */
td:first-child{white-space:nowrap}
.tbl table{font-size:.86rem}
.tbl td{min-width:9ch}
.docmeta{color:var(--muted); font-size:.9rem; margin-top:-.4rem}
.req{border:1px solid var(--line2); border-radius:12px; background:var(--card); box-shadow:var(--shadow);
  margin:1.1rem 0; overflow:hidden}
.req-h{display:flex; flex-wrap:wrap; gap:.6rem; align-items:baseline; padding:.8rem 1.15rem;
  background:var(--panel); border-bottom:1px solid var(--line)}
.req-h b{color:var(--head); font-weight:650}
.rid{font-family:ui-monospace,'SF Mono',Menlo,Consolas,monospace; font-size:.8rem; font-weight:650; color:var(--brand-ink)}
.req-b{padding:.8rem 1.15rem 1rem}
.req-b p{margin:.2rem 0 .5rem}
.trace{color:var(--muted); font-size:.84rem}
.gl.acc-l::before{background:var(--brand)}
ul.acc{margin:.3rem 0 0; padding-left:1.1rem; font-size:.92rem}
.pri{font-family:ui-monospace,'SF Mono',Menlo,Consolas,monospace; font-size:.7rem; font-weight:650;
  padding:.08rem .5rem; border-radius:6px; border:1px solid currentColor}
.pri.must{color:var(--fail)} .pri.should{color:var(--warn)} .pri.could{color:var(--pass)} .pri.wont{color:var(--muted)}
.ws.warn{color:var(--warn); background:color-mix(in srgb, var(--warn) 10%, transparent); border:1px solid color-mix(in srgb, var(--warn) 30%, transparent)}
.lvl{font-family:ui-monospace,'SF Mono',Menlo,Consolas,monospace; font-size:.72rem; font-weight:650}
.lvl.high{color:var(--fail)} .lvl.medium{color:var(--warn)} .lvl.low{color:var(--pass)}
.meter{height:8px; border-radius:999px; background:var(--line); overflow:hidden; margin:.2rem 0 1.2rem}
.meter i{display:block; height:100%; border-radius:999px}
.contest{border:1px solid color-mix(in srgb, var(--warn) 35%, transparent); background:color-mix(in srgb, var(--warn) 7%, transparent);
  border-radius:10px; padding:.8rem 1.1rem; margin:1rem 0 0; font-size:.93rem}
.contest ul{margin:.3rem 0 0}
.oq{display:flex; gap:.8rem; padding:.85rem 1rem; border:1px solid var(--line2); border-radius:10px;
  background:var(--card); margin:.7rem 0; cursor:pointer}
.oq input{width:18px; height:18px; margin-top:.2rem; accent-color:var(--brand); flex-shrink:0}
.oq .q{font-weight:600; color:var(--head); display:block}
.oq.done .q{text-decoration:line-through; opacity:.55}
.oq .why{display:block; color:var(--muted); font-size:.88rem; margin-top:.2rem}
.conf{float:right; margin-left:.6rem}
.promptwrap{position:relative}
pre.prompt{background:var(--panel); border:1px solid var(--line2); border-radius:10px; padding:1.1rem 1.2rem;
  white-space:pre-wrap; overflow-wrap:anywhere; font:13px/1.6 ui-monospace,'SF Mono',Menlo,Consolas,monospace; color:var(--head)}
.copy{position:absolute; top:.6rem; right:.6rem; font:inherit; font-size:.78rem; font-weight:600; cursor:pointer;
  color:var(--head); background:var(--card); border:1px solid var(--line2); border-radius:8px; padding:.3rem .7rem}
.copy:hover{background:var(--panel)}
.toast{position:fixed; bottom:24px; left:50%; transform:translateX(-50%); background:var(--head); color:var(--bg);
  padding:.5rem 1rem; border-radius:8px; font-size:.85rem; font-weight:600; opacity:0; pointer-events:none; transition:opacity .2s}
.toast.show{opacity:1}
/* enhancements */
.ws{white-space:normal; overflow-wrap:anywhere}
main p, main li{overflow-wrap:anywhere}

.idd{scroll-margin-top:90px}
a.idref{font-family:ui-monospace,'SF Mono',Menlo,Consolas,monospace; font-size:.86em; text-decoration:none;
  color:var(--brand-ink); background:color-mix(in srgb, var(--brand) 8%, transparent); padding:0 .25em; border-radius:4px}
a.idref:hover{background:color-mix(in srgb, var(--brand) 18%, transparent)}
tr:has(.idd:target) td, .req:has(.idd:target), .oq:has(.idd:target){
  background:color-mix(in srgb, var(--brand) 9%, var(--card)); transition:background .3s}
.req:has(.idd:target){box-shadow:0 0 0 2px color-mix(in srgb, var(--brand) 45%, transparent)}
.mix{display:flex; height:10px; border-radius:999px; overflow:hidden; gap:2px; margin:1rem 0 .3rem}
.mix i{display:block} .mix i.must{background:var(--fail)} .mix i.should{background:var(--warn)}
.mix i.could{background:var(--pass)} .mix i.wont{background:var(--muted)}
.mix-l{color:var(--muted); font-size:.82rem; margin:0}
.filter{display:flex; flex-wrap:wrap; gap:.5rem; align-items:center; margin:1rem 0 .4rem; position:sticky; top:0; z-index:5;
  padding:.6rem 0; background:color-mix(in srgb, var(--bg) 92%, transparent); backdrop-filter:blur(6px)}
.fb{font:inherit; font-size:.8rem; font-weight:600; cursor:pointer; color:var(--muted); background:var(--card);
  border:1px solid var(--line2); border-radius:999px; padding:.25rem .8rem}
.fb:hover{color:var(--head)} .fb.on{color:var(--brand-ink); border-color:var(--brand); background:color-mix(in srgb, var(--brand) 9%, transparent)}
#req-q{font:inherit; font-size:.85rem; color:var(--head); background:var(--card); border:1px solid var(--line2);
  border-radius:8px; padding:.3rem .7rem; min-width:14rem; flex:1; max-width:22rem}
.req.hide{display:none}
.heat{margin:1.2rem 0; max-width:min(34rem, 100%); overflow-x:auto}
.heat table{border-collapse:separate; border-spacing:4px; width:100%; table-layout:fixed}
.heat th:first-child{width:9rem}
.heat th{background:none; border:none; font-size:.66rem; text-align:center; padding:.2rem}
.heat th[scope=row]{text-align:right}
.hm{height:3.2rem; text-align:center; vertical-align:middle; border-radius:8px; border:1px solid var(--line)}
.hm.s0,.hm.s1{background:color-mix(in srgb, var(--pass) 10%, var(--card))}
.hm.s2{background:color-mix(in srgb, var(--warn) 14%, var(--card))}
.hm.s3,.hm.s4{background:color-mix(in srgb, var(--fail) 16%, var(--card))}
#readbar{position:fixed; top:0; left:0; height:3px; width:0; z-index:60; background:linear-gradient(90deg, var(--sp), var(--sc), var(--sa))}
/* ── theme families: structure, not just colour ── */
/* Tokens live in the families block at the top. These rules change hierarchy and density
   per family; project-f (no rules here) is the baseline. */
:root[data-family="almanac"] body{font-size:17px; line-height:1.72}
:root[data-family="almanac"] main{max-width:1040px; padding-top:64px}
:root[data-family="almanac"] h1, :root[data-family="almanac"] .ch-title, :root[data-family="almanac"] h3,
:root[data-family="almanac"] .nav-brand .nb-t, :root[data-family="almanac"] .gate-name{font-family:var(--font-display); font-weight:500; letter-spacing:-.012em}
:root[data-family="almanac"] .tldr{box-shadow:none; border-radius:4px; background:var(--panel); border-color:var(--line)}
:root[data-family="almanac"] .tldr::before{display:none}
:root[data-family="almanac"] .ch-kicker, :root[data-family="almanac"] .nav-group, :root[data-family="almanac"] .nav-brand .nb-d{font-family:inherit; text-transform:none; letter-spacing:0; font-weight:500}
:root[data-family="almanac"] .ch-kicker{font-size:.9rem}
:root[data-family="almanac"] .nav-group{font-size:.78rem; color:var(--head)}
:root[data-family="almanac"] .ch-title{font-size:2.05rem}
:root[data-family="almanac"] h2{margin-top:5rem; padding-top:2.8rem}
:root[data-family="almanac"] .tbl, :root[data-family="almanac"] .req, :root[data-family="almanac"] .gate{box-shadow:none; border-radius:4px}
:root[data-family="almanac"] figure.fig{border:0; border-radius:4px; padding:1.5rem 1.5rem 1.15rem}
:root[data-family="almanac"] figure.fig figcaption{font-family:var(--font-display); font-size:1rem; font-style:italic; color:var(--text)}
:root[data-family="almanac"] figure.fig figcaption b{font-style:normal}
:root[data-family="console"] body{font-size:15px; line-height:1.6; letter-spacing:-.006em}
:root[data-family="console"] nav.side{width:236px; padding:20px 12px 20px 16px; font-size:.78rem}
:root[data-family="console"] main{max-width:1240px; padding:28px clamp(16px, 2vw, 36px) 80px}
:root[data-family="console"] .tldr{margin-top:1.3rem; padding:1.1rem 1.3rem 1rem; box-shadow:none; border-radius:10px}
:root[data-family="console"] .tldr::before{height:2px; background:var(--brand)}
:root[data-family="console"] .tldr-body{column-width:24rem; column-gap:2rem}
:root[data-family="console"] h2{margin:2.6rem 0 .8rem; padding-top:1.4rem}
:root[data-family="console"] .ch-title{font-size:1.3rem; font-weight:600}
:root[data-family="console"] h3{font-size:1.02rem; margin-top:1.6rem}
:root[data-family="console"] .tbl, :root[data-family="console"] .req, :root[data-family="console"] .gate{box-shadow:none; border-radius:8px}
:root[data-family="console"] .tbl table{font-size:.8rem}
:root[data-family="console"] td{padding:.4rem .65rem}
:root[data-family="console"] th{padding:.45rem .65rem}
:root[data-family="console"] .req{margin:.55rem 0}
:root[data-family="console"] .req-h{padding:.5rem .9rem}
:root[data-family="console"] .req-b{padding:.55rem .9rem .7rem}
:root[data-family="console"] figure.fig{border-radius:10px; padding:.8rem .8rem .7rem; margin:1.4rem 0}
:root[data-family="console"] figure.fig figcaption{font-size:.78rem}
:root[data-family="grid"] .tldr{box-shadow:none; border-color:var(--line)}
:root[data-family="grid"] .tldr::before{height:4px; background:var(--brand)}
:root[data-family="grid"] .ch-kicker, :root[data-family="grid"] .nav-group{font-family:inherit; text-transform:none; letter-spacing:0; font-weight:400}
:root[data-family="grid"] .ch-kicker{font-size:.85rem}
:root[data-family="grid"] .ch-title{font-family:var(--font-display); font-weight:300; font-size:2rem; letter-spacing:-.015em}
:root[data-family="grid"] h2{border-top:1px solid var(--line2)}
:root[data-family="grid"] .tbl, :root[data-family="grid"] .req, :root[data-family="grid"] .gate{box-shadow:none}
:root[data-family="grid"] figure.fig{border:0}
:root[data-family] .tldr h2{margin:0 0 1.1rem; padding-top:0; border-top:none}
@media (max-width:960px){
  :root[data-family="almanac"] main{padding-top:24px}
}

@media print{#readbar,.filter{display:none!important} nav.side,#themeflip,.copy,.toast,.toc-mobile{display:none!important} main{max-width:none}}
</style>
</head>
<body>
<div class="layout">
<nav class="side">
<!--PRDFORGE:NAV-->
</nav>
<main>
<!--PRDFORGE:BODY-->
</main>
</div>
<div class="toast" id="toast">Copied</div>
<script>
(function(){
  var root = document.documentElement, LS = null;
  try { LS = window.localStorage; } catch (e) {}
  // scrollspy
  var links = [].slice.call(document.querySelectorAll("nav.side a[href^='#']"));
  var anchors = [].slice.call(document.querySelectorAll("main a[id]"));
  function spy(){
    if (!anchors.length) return;
    var cur = anchors[0];
    for (var i = 0; i < anchors.length; i++){ if (anchors[i].getBoundingClientRect().top <= 130) cur = anchors[i]; else break; }
    links.forEach(function(l){ l.classList.toggle("on", l.getAttribute("href") === "#" + cur.id); });
  }
  var t = false;
  addEventListener("scroll", function(){ if (t) return; t = true; requestAnimationFrame(function(){ spy(); t = false; }); }, {passive:true});
  spy();
  // theme flip (sets data-theme so tokens swap in both directions)
  var flip = document.createElement("button");
  flip.id = "themeflip"; flip.type = "button"; flip.setAttribute("aria-label", "Switch between light and dark");
  flip.textContent = "◐";
  flip.addEventListener("click", function(){
    var cur = root.getAttribute("data-theme");
    var dark = cur ? cur === "dark" : (window.matchMedia && matchMedia("(prefers-color-scheme: dark)").matches);
    var next = dark ? "light" : "dark";
    root.setAttribute("data-theme", next); root.style.colorScheme = next;
  });
  document.body.appendChild(flip);
  // readiness meter colour from tokens
  var m = document.querySelector(".meter i");
  if (m) {
    var n = parseInt(m.getAttribute("data-score"), 10) || 0;
    m.style.width = Math.max(0, Math.min(100, n)) + "%";
    m.style.background = n >= 70 ? "var(--pass)" : n >= 40 ? "var(--warn)" : "var(--fail)";
  }
  // copy the implementation prompt
  function toast(msg){ var el = document.getElementById("toast"); if (!el) return; el.textContent = msg; el.classList.add("show"); setTimeout(function(){ el.classList.remove("show"); }, 1400); }
  var cs = document.getElementById("copy-spec");
  if (cs) cs.addEventListener("click", function(){
    var txt = (document.getElementById("spec-text") || {}).innerText || "";
    if (navigator.clipboard && navigator.clipboard.writeText) navigator.clipboard.writeText(txt).then(function(){ toast("Copied"); }, function(){ toast("Copy failed"); });
    else toast("Copy failed");
  });
  // open-question checklist, persisted per slug and keyed by question text
  function hashStr(s){ var h = 5381, i = s.length; while (i) { h = (h * 33) ^ s.charCodeAt(--i); } return (h >>> 0).toString(36); }
  var list = document.getElementById("oq-list");
  if (list) {
    var slug = list.getAttribute("data-slug") || "prd";
    [].forEach.call(list.querySelectorAll(".oq"), function(row){
      var box = row.querySelector("input"), q = row.querySelector(".q");
      var key = "prdforge:" + slug + ":oq:" + hashStr((q ? q.textContent : "").trim());
      var saved = null; try { saved = LS && LS.getItem(key); } catch (e) {}
      if (saved === "1") { box.checked = true; row.classList.add("done"); }
      box.addEventListener("change", function(){ row.classList.toggle("done", box.checked); try { LS && LS.setItem(key, box.checked ? "1" : "0"); } catch (e) {} });
    });
  }

  // reading progress
  var rb = document.createElement("div"); rb.id = "readbar"; document.body.appendChild(rb);
  function prog(){ var h = document.documentElement; var max = h.scrollHeight - h.clientHeight; rb.style.width = (max > 0 ? (h.scrollTop / max) * 100 : 0) + "%"; }
  addEventListener("scroll", prog, {passive:true}); prog();
  // requirement filter + search
  var cards = [].slice.call(document.querySelectorAll(".req")), cur = "all";
  var q = document.getElementById("req-q"), n = document.getElementById("req-n");
  function apply(){
    var term = (q && q.value || "").toLowerCase(), shown = 0;
    cards.forEach(function(c){
      var ok = (cur === "all" || c.getAttribute("data-pri") === cur) && (!term || c.textContent.toLowerCase().indexOf(term) > -1);
      c.classList.toggle("hide", !ok); if (ok) shown++;
    });
    if (n) n.textContent = shown + " of " + cards.length + " shown";
  }
  [].forEach.call(document.querySelectorAll(".fb"), function(b){
    b.addEventListener("click", function(){
      cur = b.getAttribute("data-f");
      [].forEach.call(document.querySelectorAll(".fb"), function(x){ x.classList.toggle("on", x === b); });
      apply();
    });
  });
  if (q) q.addEventListener("input", apply);
  apply();
  // a link to a hidden card clears the filter first
  addEventListener("hashchange", function(){
    var el = document.getElementById(location.hash.slice(1));
    var card = el && el.closest && el.closest(".req");
    if (card && card.classList.contains("hide")) { cur = "all"; if (q) q.value = "";
      [].forEach.call(document.querySelectorAll(".fb"), function(x){ x.classList.toggle("on", x.getAttribute("data-f") === "all"); });
      apply(); el.scrollIntoView(); }
  });
  // open-question progress
  function oqProgress(){
    var boxes = document.querySelectorAll("#oq-list input"), done = 0;
    [].forEach.call(boxes, function(b){ if (b.checked) done++; });
    var el = document.getElementById("oq-progress"); if (el) el.textContent = done + " of " + boxes.length + " answered.";
  }
  document.addEventListener("change", function(e){ if (e.target.closest && e.target.closest("#oq-list")) oqProgress(); });
  oqProgress();
})();
</script>
</body>
</html>
